name: Fork build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/opencode-free

env:
  JCODE_CI: "1"
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  macos-arm64:
    name: Build macOS arm64 binary
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: fork-build-macos-arm64

      - name: Build release binary
        run: cargo build --release --locked -p jcode --bin jcode

      - name: Smoke test
        run: ./target/release/jcode --version

      - uses: actions/upload-artifact@v4
        with:
          name: jcode-macos-arm64
          path: target/release/jcode
          if-no-files-found: error
          retention-days: 14
